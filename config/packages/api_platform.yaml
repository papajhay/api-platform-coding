api_platform:
    title: Blog API
    description: 'REST API for managing users, posts, and comments in the blog platform.'
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    openapi:
        contact:
            name: API Support
            email: support@example.com
        swagger_ui_extra_configuration:
            docExpansion: list
            displayRequestDuration: true
